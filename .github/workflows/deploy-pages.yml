name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # GitHub Pages is static hosting on the custom domain vappino.com (served
      # from the root, so no base path). API routes are excluded and orders go
      # to the Vercel-hosted API (override with repository variable ORDERS_API_URL).
      - name: Build static frontend
        run: rm -rf src/app/api && npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://vappino.com
          NEXT_PUBLIC_ORDERS_API_URL: ${{ vars.ORDERS_API_URL || 'https://vappino-e-commerce-platform-build-nour-991c.vercel.app/api/orders' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
